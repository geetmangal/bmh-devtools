# Loopback-only recursive resolver (host networking): answers 127.0.0.1:5335, nothing else.
server:
    username: ""
    chroot: ""
    directory: "/etc/unbound"
    pidfile: ""
    use-syslog: no
    logfile: ""
    verbosity: 1
    interface: 127.0.0.1
    port: 5335
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    # Full recursion from root hints (no forwarders): this is the whole point.
    root-hints: "/usr/share/dns/root.hints"
    # Static root KSK from the dns-root-data package (read-only container; rebuild the image to refresh).
    trust-anchor-file: "/usr/share/dns/root.key"
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    qname-minimisation: yes
    hide-identity: yes
    hide-version: yes
    use-caps-for-id: no
    edns-buffer-size: 1232
    prefetch: yes
    num-threads: 1
    msg-cache-size: 32m
    rrset-cache-size: 64m
    cache-min-ttl: 0
    cache-max-ttl: 3600
    # DNSBL answers are 127.0.0.x by design; do not treat them as rebinding.
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: fd00::/8
    private-address: fe80::/10
    ratelimit: 1000
    ip-ratelimit: 0

remote-control:
    control-enable: no
