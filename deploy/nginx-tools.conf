# Serve BookMyHost Dev Tools under https://bookmyhost.com/tools/ by reverse proxy.
# Include this inside the existing `server { ... }` block for bookmyhost.com.
# The app itself listens on 127.0.0.1:8765 (docker-compose.yml) and already
# generates its page routes under /tools/ and its API under /api/v1/.

location /tools/ {
    proxy_pass         http://127.0.0.1:8765;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;   # first hop = client IP, used for rate limiting
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_buffering    off;
}

# Static assets: long cache.
location /tools/static/ {
    proxy_pass http://127.0.0.1:8765;
    proxy_set_header Host $host;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
}

# JSON API + OpenAPI docs. Extra nginx-side rate limit as a second layer.
# Put `limit_req_zone $binary_remote_addr zone=bmhtools:10m rate=1r/s;` in the http {} block.
location /api/v1/ {
    limit_req          zone=bmhtools burst=20 nodelay;
    proxy_pass         http://127.0.0.1:8765;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 16k;
}

location = /tools/sitemap.xml { proxy_pass http://127.0.0.1:8765; proxy_set_header Host $host; }
location = /healthz          { proxy_pass http://127.0.0.1:8765; access_log off; }
# NOTE: the site's own /robots.txt must contain "Sitemap: https://bookmyhost.com/tools/sitemap.xml"
# and must not Disallow /tools/. Only /api/ should be disallowed for crawlers.
