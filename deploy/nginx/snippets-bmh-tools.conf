# BookMyHost Dev Tools under https://bookmyhost.com/tools/ (installed as /etc/nginx/snippets/bmh-tools.conf).
# Included in the Cloudflare-proxied `server_name bookmyhost.com www.bookmyhost.com *.bookmyhost.com`
# 443 block of sites-available/bmh-wildcard, BEFORE bmh-panel-locations.conf. Only /tools/... is touched.
# The app (docker container bmh-devtools) listens on 127.0.0.1:8765.
# Reseller storefronts ({code}.bookmyhost.com) share that server block: they get 404 here.

location = /tools {
    if ($host != "bookmyhost.com") { return 404; }
    return 301 https://bookmyhost.com/tools/;
}

# JSON API + OpenAPI: strict per-IP limit, never cached (the app also sends Cache-Control: no-store).
location ^~ /tools/api/ {
    if ($host != "bookmyhost.com") { return 404; }
    limit_req zone=bmh_tools_api burst=10 nodelay;
    limit_req_status 429;
    error_page 429 = @bmh_tools_429;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:8765;
    include /etc/nginx/snippets/bmh-tools-proxy.conf;
    proxy_read_timeout 90s;
}

# Static assets: the app sends Cache-Control public/immutable for ?v=<hash> URLs; Cloudflare caches them.
location ^~ /tools/static/ {
    if ($host != "bookmyhost.com") { return 404; }
    limit_req zone=bmh_tools_pages burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8765;
    include /etc/nginx/snippets/bmh-tools-proxy.conf;
    access_log off;
}

location = /tools/healthz {
    proxy_pass http://127.0.0.1:8765;
    include /etc/nginx/snippets/bmh-tools-proxy.conf;
    access_log off;
}

# Pages and /tools/sitemap.xml.
location ^~ /tools/ {
    if ($host != "bookmyhost.com") { return 404; }
    limit_req zone=bmh_tools_pages burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8765;
    include /etc/nginx/snippets/bmh-tools-proxy.conf;
    proxy_read_timeout 30s;
}

location @bmh_tools_429 {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "10" always;
    return 429 '{"detail":"Rate limit exceeded: 30 requests per minute per IP."}';
}
