# BookMyHost Dev Tools under https://bookmyhost.com/tools/ (installed as /etc/nginx/snippets/bmh-tools.conf).
# Included in the Cloudflare-proxied `server_name bookmyhost.com www.bookmyhost.com *.bookmyhost.com`
# 443 block of sites-available/bmh-wildcard, BEFORE bmh-panel-locations.conf. Only /tools/... is touched.
# The app (docker container bmh-devtools) listens on 127.0.0.1:8765.
# Reseller storefronts ({code}.bookmyhost.com) share that server block: they get 404 here.

location = /tools {
    if ($host != "bookmyhost.com") { return 404; }
    return 301 https://bookmyhost.com/tools/;
}

# Looking glass (ping/traceroute/BGP) and port checker: heavier, so 6/min per IP, burst 3 (longer read timeout:
# traceroute can take up to 40 s). Longest-prefix match: these win over /tools/api/ below.
location ^~ /tools/api/v1/lg/ {
    if ($host != "bookmyhost.com") { return 404; }
    limit_req zone=bmh_tools_net burst=3 nodelay;
    limit_req_status 429;
    error_page 429 = @bmh_tools_429;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8765;
    include /etc/nginx/snippets/bmh-tools-proxy.conf;
    proxy_read_timeout 60s;
}
location ^~ /tools/api/v1/ports/ {
    if ($host != "bookmyhost.com") { return 404; }
    limit_req zone=bmh_tools_net burst=3 nodelay;
    limit_req_status 429;
    error_page 429 = @bmh_tools_429;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8765;
    include /etc/nginx/snippets/bmh-tools-proxy.conf;
    proxy_read_timeout 15s;
}

# JSON API + OpenAPI: strict per-IP limit, never cached (the app also sends Cache-Control: no-store).
location ^~ /tools/api/ {
    if ($host != "bookmyhost.com") { return 404; }
    limit_req zone=bmh_tools_api burst=10 nodelay;
    limit_req_status 429;
    error_page 429 = @bmh_tools_429;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:8765;
    include /etc/nginx/snippets/bmh-tools-proxy.conf;
    proxy_read_timeout 90s;
}

# Static assets. Pages reference /tools/static/v/<build>/... (build = BMH_TOOLS_BUILD or a content hash computed at
# app start), which the app serves with Cache-Control: public, max-age=31536000, immutable; ES-module imports resolve
# under the same versioned path, so a deploy can never serve a mix of old and new modules. Unversioned
# /tools/static/... still works with a 5 minute cache. No special nginx handling is needed: do not add `expires` here
# (it would override the app's headers); Cloudflare caches the versioned URLs.
location ^~ /tools/static/ {
    if ($host != "bookmyhost.com") { return 404; }
    limit_req zone=bmh_tools_pages burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8765;
    include /etc/nginx/snippets/bmh-tools-proxy.conf;
    access_log off;
}

location = /tools/healthz {
    proxy_pass http://127.0.0.1:8765;
    include /etc/nginx/snippets/bmh-tools-proxy.conf;
    access_log off;
}

# Embeddable widgets (iframes on third-party sites): pages zone, same proxy. The app itself drops X-Frame-Options
# and sets frame-ancestors * for this path ONLY; every other path stays DENY. Do not add_header X-Frame-Options here.
location ^~ /tools/embed/ {
    if ($host != "bookmyhost.com") { return 404; }
    limit_req zone=bmh_tools_pages burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8765;
    include /etc/nginx/snippets/bmh-tools-proxy.conf;
    proxy_read_timeout 30s;
}

# Pages and /tools/sitemap.xml (also /tools/embed.js, the optional parent-side resize helper).
location ^~ /tools/ {
    if ($host != "bookmyhost.com") { return 404; }
    limit_req zone=bmh_tools_pages burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8765;
    include /etc/nginx/snippets/bmh-tools-proxy.conf;
    proxy_read_timeout 30s;
}

location @bmh_tools_429 {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "10" always;
    return 429 '{"detail":"Rate limit exceeded: 30 requests per minute per IP."}';
}
