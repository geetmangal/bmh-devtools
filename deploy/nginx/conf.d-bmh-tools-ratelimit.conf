# BookMyHost Dev Tools (bookmyhost.com/tools/) rate-limit zones, http{} level.
# Installed as /etc/nginx/conf.d/bmh-tools-ratelimit.conf. Keyed on $binary_remote_addr, which in the
# Cloudflare-proxied bookmyhost.com vhost is the visitor IP (set_real_ip_from CF ranges +
# real_ip_header CF-Connecting-IP). This nginx layer is authoritative; the app keeps its own bucket.
limit_req_zone $binary_remote_addr zone=bmh_tools_api:10m   rate=30r/m;   # JSON API: 30/min, burst 10
limit_req_zone $binary_remote_addr zone=bmh_tools_pages:10m rate=5r/s;    # pages + static
