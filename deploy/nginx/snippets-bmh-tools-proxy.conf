# Proxy headers for the Dev Tools app (installed as /etc/nginx/snippets/bmh-tools-proxy.conf).
# X-Real-IP / X-Forwarded-For are SET (not appended) to the Cloudflare-verified client IP, so a
# client-supplied X-Forwarded-For can never reach the app's rate limiter.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Connection        "";
proxy_connect_timeout 5s;
proxy_buffering on;
