services:
  devtools:
    build: .
    image: bmh-devtools:latest
    container_name: bmh-devtools
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      BMH_TOOLS_BASE_URL: https://bookmyhost.com
      BMH_TOOLS_PREFIX: /tools
      BMH_TOOLS_RATE_PER_MIN: "30"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 1.0
