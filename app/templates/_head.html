<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ canonical }}">
{% if noindex %}<meta name="robots" content="noindex,follow">{% endif %}
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site_name }}">
{% if og_image %}<meta property="og:image" content="{{ og_image }}">
<meta property="og:image:width" content="{{ og_w }}">
<meta property="og:image:height" content="{{ og_h }}">
<meta property="og:image:alt" content="{{ og_alt }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ title }}">
<meta name="twitter:description" content="{{ description }}">
<meta name="twitter:image" content="{{ og_image }}">
{% else %}<meta name="twitter:card" content="summary">
{% endif %}
{% if llms_links %}<link rel="alternate" type="text/plain" href="{{ base_url }}{{ prefix }}/llms.txt" title="llms.txt">
<link rel="alternate" type="text/plain" href="{{ base_url }}{{ prefix }}/llms-full.txt" title="llms-full.txt">
{% endif %}
<meta name="color-scheme" content="light dark">
<script type="application/ld+json" nonce="{{ csp_nonce }}">{{ schema_json | safe }}</script>
<script type="application/json" id="glossary" nonce="{{ csp_nonce }}">{{ glossary_json | safe }}</script>
<script type="application/json" id="toolbox-config" nonce="{{ csp_nonce }}">{{ toolbox_json | safe }}</script>
<link rel="stylesheet" href="{{ static_url('css/tools.css') }}">
