<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ canonical }}">
{% if noindex %}<meta name="robots" content="noindex,follow">{% endif %}
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site_name }}">
<meta name="twitter:card" content="summary">
<meta name="color-scheme" content="light dark">
<script type="application/ld+json" nonce="{{ csp_nonce }}">{{ schema_json | safe }}</script>
<script type="application/json" id="glossary" nonce="{{ csp_nonce }}">{{ glossary_json | safe }}</script>
<script type="application/json" id="toolbox-config" nonce="{{ csp_nonce }}">{{ toolbox_json | safe }}</script>
<link rel="stylesheet" href="{{ static_url('css/tools.css') }}">
