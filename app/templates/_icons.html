{# Inline SVG icon set (24x24, stroke). Usage: {% from "_icons.html" import icon %}{{ icon("dns", "w-4 h-4") }} #}
{% macro icon(name, cls="w-4 h-4") -%}
<svg class="{{ cls }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == "dns" %}<rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><path d="M7 7h.01M7 17h.01"/>
{%- elif name == "grid" %}<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
{%- elif name == "gauge" %}<path d="M4 17a8 8 0 1 1 16 0"/><path d="M12 17l4-6"/>
{%- elif name == "route" %}<circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h6a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h6"/>
{%- elif name == "search" %}<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>
{%- elif name == "swap" %}<path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/>
{%- elif name == "plug" %}<path d="M9 2v5M15 2v5M6 7h12v4a6 6 0 0 1-12 0zM12 17v5"/>
{%- elif name == "calc" %}<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/>
{%- elif name == "globe" %}<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>
{%- elif name == "mail" %}<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>
{%- elif name == "sun" %}<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
{%- elif name == "moon" %}<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>
{%- elif name == "code" %}<path d="M8 8l-5 4 5 4M16 8l5 4-5 4M14 5l-4 14"/>
{%- elif name == "arrow" %}<path d="M5 12h14M13 6l6 6-6 6"/>
{%- elif name == "external" %}<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>
{%- elif name == "inbox" %}<path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 3h6l1-3h5"/>
{%- elif name == "shield" %}<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>
{%- elif name == "key" %}<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l2 2"/>
{%- elif name == "ban" %}<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>
{%- elif name == "file" %}<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>
{%- elif name == "graph" %}<circle cx="12" cy="12" r="3"/><circle cx="5" cy="5" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/><path d="M7 7l3 3M17 7l-3 3M7 17l3-3M17 17l-3-3"/>
{%- else %}<circle cx="12" cy="12" r="9"/>
{%- endif %}</svg>
{%- endmacro %}
